<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>프로필 카드</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      padding: 20px;
    }

    .profile-card {
      background-color: #ffffff;
      border-radius: 24px;
      padding: 40px 32px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
    }

    .avatar-placeholder {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background-color: #d1d5db;
      margin: 0 auto 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #6b7280;
      font-size: 14px;
      font-weight: 500;
    }

    .name {
      font-size: 26px;
      font-weight: 700;
      color: #1f2937;
      margin-bottom: 10px;
      transition: color 0.3s ease;
      cursor: pointer;
    }

    .name:hover {
      color: #764ba2;
    }

    .bio {
      font-size: 15px;
      color: #6b7280;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .favorites {
      list-style: none;
      text-align: left;
      border-top: 1px solid #f3f4f6;
      padding-top: 24px;
      margin-bottom: 24px;
    }

    .favorites li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      margin-bottom: 10px;
      background-color: #f9fafb;
      border-radius: 12px;
      font-size: 15px;
      color: #374151;
    }

    .favorites li:last-child {
      margin-bottom: 0;
    }

    .emoji {
      font-size: 20px;
    }

    .sns-links {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .sns-btn {
      flex: 1;
      text-decoration: none;
      padding: 10px 0;
      border-radius: 12px;
      background-color: #f3f4f6;
      color: #374151;
      font-size: 14px;
      font-weight: 600;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .sns-btn:hover {
      background-color: #764ba2;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <main class="profile-card">
    <div class="avatar-placeholder">프로필 사진</div>
    <h1 class="name">김재민</h1>
    <p class="bio">여행을 좋아합니다.</p>
    
    <ul class="favorites">
      <li><span class="emoji">☕</span> 따뜻한 아메리카노 한 잔</li>
      <li><span class="emoji">🏕️</span> 주말에 떠나는 가족 캠핑</li>
      <li><span class="emoji">💻</span> 깔끔한 코드 작성하기</li>
    </ul>

    <div class="sns-links">
      <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="sns-btn">GitHub</a>
      <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" class="sns-btn">Instagram</a>
      <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" class="sns-btn">LinkedIn</a>
    </div>
  </main>
</body>
</html>
